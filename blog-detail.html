    var SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQdbCcnj71jq-bFd969cZTzBHIJEa1YR0IShsyEbg5Vw9Wc_bJAlf339FrAxX5WvVAj93Co_xTT4iJq/pub?output=csv";

    var CACHE_KEY = 'browfairy_blogs_csv_cache';
    var CACHE_TTL = 2 * 60 * 1000;
    var FALLBACK_BLOGS = [
      { id: 'article1', title: 'How to Choose the Best Permanent Makeup Studio', excerpt: 'Choosing the right studio is an important decision.', body: 'Permanent makeup is an investment in your appearance that can last for years.\n\n## Look Beyond Before-and-After Photos\nBeautiful photos matter, but ask about natural, healed results across different clients.\n\n## Prioritize Natural-Looking Results\nA skilled artist understands facial symmetry, colour theory, and the result you want to live with every day.\n\n## Final Thoughts\nChoose a studio that combines technical expertise, aesthetic judgement, and personalised care.' },
      { id: 'article2', title: 'Microblading vs Nano Brows: Which One Is Right for You?', excerpt: 'Different brow techniques suit different needs.', body: 'Microblading and nano brows can both create beautiful, natural-looking results, but they use different techniques.\n\n## What Is Microblading?\nMicroblading uses a manual tool with fine needles to create hair-like strokes.\n\n## What Are Nano Brows?\nNano brows use a digital machine with ultra-fine needle cartridges and can be a better option for oily skin.\n\n## Final Thoughts\nThe best choice depends on your skin type, desired look, and an experienced artist\'s advice.' },
      { id: 'article3', title: 'Lip Blush: Everything You Need to Know Before Your Appointment', excerpt: 'A guide to lip blush appointments.', body: 'Lip blush is a semi-permanent treatment that enhances natural lip colour and definition.\n\n## What Is Lip Blush?\nPigment is deposited with a digital machine to create a soft, natural-looking tint.\n\n## What to Expect During the Procedure\nYour appointment generally includes a consultation, numbing, pigment application, and a final colour check.\n\n## Final Thoughts\nWith the right artist and aftercare, lip blush can be a beautiful confidence boost.' }
    ];

    /* ===== REVEAL PAGE — call this ONLY after content is rendered ===== */
    function revealPage() {
      var loader = document.getElementById('page-loader');
      if (loader) {
        loader.classList.add('fade-out');
        setTimeout(function() { loader.remove(); }, 500);
      }
      document.body.classList.add('page-loaded');
    }

    /* Fallback — reveal after max 5 seconds no matter what */
    setTimeout(revealPage, 5000);

    function escapeHtml(value) {
      if (!value) return '';
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    /* ---- CSV parser ---- */
    function parseCSV(text) {
      var rows = [];
      var currentRow = [];
      var currentField = '';
      var inQuotes = false;
      var i = 0;

      while (i < text.length) {
        var ch = text[i];

        if (inQuotes) {
          if (ch === '"') {
            if (i + 1 < text.length && text[i + 1] === '"') {
              currentField += '"';
              i += 2;
              continue;
            } else {
              inQuotes = false;
              i++;
              continue;
            }
          } else {
            currentField += ch;
            i++;
            continue;
          }
        }

        if (ch === '"') {
          inQuotes = true;
          i++;
        } else if (ch === ',') {
          currentRow.push(currentField.trim());
          currentField = '';
          i++;
        } else if (ch === '\r') {
          i++;
        } else if (ch === '\n') {
          currentRow.push(currentField.trim());
          if (currentRow.length > 0 && currentRow.some(function(f) { return f !== ''; })) {
            rows.push(currentRow);
          }
          currentRow = [];
          currentField = '';
          i++;
        } else {
          currentField += ch;
          i++;
        }
      }

      currentRow.push(currentField.trim());
      if (currentRow.length > 0 && currentRow.some(function(f) { return f !== ''; })) {
        rows.push(currentRow);
      }

      return rows;
    }

    /* ---- Markdown to HTML ---- */
    function bodyToHtml(bodyText) {
      if (!bodyText) return '';
      var lines = bodyText.split('\n');
      var html = '';
      var inList = false;

      for (var i = 0; i < lines.length; i++) {
        var line = lines[i];

        if (inList && line.indexOf('- ') !== 0) {
          html += '</ul>';
          inList = false;
        }

        if (line.trim() === '') {
          continue;
        }

        if (line.indexOf('## ') === 0) {
          html += '<h2>' + escapeHtml(line.substring(3).trim()) + '</h2>';
        } else if (line.indexOf('### ') === 0) {
          html += '<h3>' + escapeHtml(line.substring(4).trim()) + '</h3>';
        } else if (line.indexOf('- ') === 0) {
          if (!inList) {
            html += '<ul>';
            inList = true;
          }
          html += '<li>' + escapeHtml(line.substring(2).trim()) + '</li>';
        } else {
          html += '<p>' + escapeHtml(line.trim()) + '</p>';
        }
      }

      if (inList) {
        html += '</ul>';
      }

      return html;
    }

    /* ---- Fetch with cache ---- */
    function fetchFromSheet() {
      return fetch(SHEET_CSV_URL)
        .then(function(response) {
          if (!response.ok) throw new Error('HTTP ' + response.status);
          return response.text();
        })
        .then(function(csvText) {
          var rows = parseCSV(csvText);
          if (rows.length < 2) return { blogs: FALLBACK_BLOGS };

          var headers = rows[0];
          var blogs = [];

          for (var i = 1; i < rows.length; i++) {
            var row = {};
            for (var j = 0; j < headers.length; j++) {
              row[headers[j].toLowerCase().trim()] = rows[i][j] || '';
            }

            if (!row.title || row.title.trim() === '') continue;

            blogs.push({
              id: row.id || ('article' + i),
              title: row.title.trim(),
              excerpt: row.excerpt || '',
              body: row.body || row.content || ''
            });
          }

          if (!blogs.length) blogs = FALLBACK_BLOGS;

          var data = { blogs: blogs };
          try {
            localStorage.setItem(CACHE_KEY, JSON.stringify({ data: data, timestamp: Date.now() }));
          } catch (e) {}
          return data;
        });
    }

    /* ---- Get article ID from URL ---- */
    function getArticleId() {
      var params = new URLSearchParams(window.location.search);
      return params.get('article') || '';
    }

    function setMeta(attr, key, content) {
      var selector = 'meta[' + attr + '="' + key + '"]';
      var el = document.querySelector(selector);
      if (!el) {
        el = document.createElement('meta');
        el.setAttribute(attr, key);
        document.head.appendChild(el);
      }
      el.setAttribute('content', content);
    }

    function setCanonical(href) {
      var el = document.querySelector('link[rel="canonical"]');
      if (!el) {
        el = document.createElement('link');
        el.rel = 'canonical';
        document.head.appendChild(el);
      }
      el.href = href;
    }

    function setArticleSchema(blog, pageUrl) {
      var el = document.getElementById('article-schema');
      if (!el) {
        el = document.createElement('script');
        el.type = 'application/ld+json';
        el.id = 'article-schema';
        document.head.appendChild(el);
      }
      var description = (blog.excerpt || '').trim();
      if (!description && blog.body) {
        description = String(blog.body).replace(/#/g, '').replace(/\s+/g, ' ').trim().slice(0, 160);
      }
      el.textContent = JSON.stringify({
        "@context": "https://schema.org",
        "@type": "BlogPosting",
        "headline": blog.title,
        "description": description,
        "mainEntityOfPage": pageUrl,
        "author": {
          "@type": "Person",
          "name": "Ridhima Sony",
          "url": "https://browfairypmu.com/about.html"
        },
        "publisher": {
          "@type": "BeautySalon",
          "name": "Browfairy Permanent Makeup Studio",
          "url": "https://browfairypmu.com/"
        },
        "articleSection": "Permanent Makeup",
        "inLanguage": "en-IN"
      });
    }

    /* ---- Render article ---- */
    function renderArticle(blog, container) {
      var pageUrl = 'https://browfairypmu.com/blog-detail.html?article=' + encodeURIComponent(blog.id);
      var description = (blog.excerpt || '').trim();
      if (!description && blog.body) {
        description = String(blog.body).replace(/#/g, '').replace(/\s+/g, ' ').trim().slice(0, 160);
      }
      document.title = blog.title + ' | Browfairy Hyderabad';
      setMeta('name', 'description', description);
      setMeta('property', 'og:title', blog.title + ' | Browfairy Hyderabad');
      setMeta('property', 'og:description', description);
      setMeta('property', 'og:url', pageUrl);
      setCanonical(pageUrl);
      setArticleSchema(blog, pageUrl);
      container.innerHTML =
        '<div class="article-card">' +
        '<h1>' + escapeHtml(blog.title) + '</h1>' +
        bodyToHtml(blog.body) +
        '<p class="article-studio-note">Written for clients of Browfairy Permanent Makeup Studio in Kondapur, Hyderabad.</p>' +
        '</div>';
      window.scrollTo(0, 0);
    }

    /* ---- Render not found ---- */
    function renderNotFound(container) {
      container.innerHTML =
        '<div class="not-found-card">' +
        '<h2>Article Not Found</h2>' +
        '<p>The blog post you are looking for does not exist or may have been removed.</p>' +
        '</div>';
    }

    /* ---- Init ---- */
    document.addEventListener('DOMContentLoaded', function() {
      var articleArea = document.getElementById('article-area');
      if (!articleArea) return;

      var articleId = getArticleId();
      if (!articleId) {
        renderNotFound(articleArea);
        revealPage();
        return;
      }

      /* NO skeleton shown — loader overlay covers everything */

      /* Try cache first for instant render */
      var usedCache = false;
      try {
        var cached = JSON.parse(localStorage.getItem(CACHE_KEY));
        if (cached && cached.data && cached.data.blogs) {
          var found = null;
          for (var i = 0; i < cached.data.blogs.length; i++) {
            if (cached.data.blogs[i].id === articleId) { found = cached.data.blogs[i]; break; }
          }
          if (!found) {
            for (var f = 0; f < FALLBACK_BLOGS.length; f++) {
              if (FALLBACK_BLOGS[f].id === articleId) { found = FALLBACK_BLOGS[f]; break; }
            }
          }

          if (found) {
            renderArticle(found, articleArea);
            revealPage(); /* ← reveal after rendering from cache */
            usedCache = true;
            /* Refresh in background */
            fetchFromSheet().catch(function() {});
          }
        }
      } catch (e) {}

      if (usedCache) return;

      /* Fetch fresh */
      fetchFromSheet()
        .then(function(data) {
          var blogs = (data && data.blogs) ? data.blogs : [];
          var found = null;
          for (var i = 0; i < blogs.length; i++) {
            if (blogs[i].id === articleId) { found = blogs[i]; break; }
          }

          if (found) {
            renderArticle(found, articleArea);
          } else {
            renderNotFound(articleArea);
          }
          revealPage(); /* ← reveal AFTER rendering */
        })
        .catch(function(error) {
          console.error('Failed to load article:', error);

          /* Try stale cache as fallback */
          try {
            var cached = JSON.parse(localStorage.getItem(CACHE_KEY));
            if (cached && cached.data && cached.data.blogs) {
              var found = null;
              for (var i = 0; i < cached.data.blogs.length; i++) {
                if (cached.data.blogs[i].id === articleId) { found = cached.data.blogs[i]; break; }
              }
              if (found) {
                renderArticle(found, articleArea);
                revealPage();
                return;
              }
            }
          } catch (e) {}

          var fallback = null;
          for (var f = 0; f < FALLBACK_BLOGS.length; f++) {
            if (FALLBACK_BLOGS[f].id === articleId) { fallback = FALLBACK_BLOGS[f]; break; }
          }
          if (fallback) renderArticle(fallback, articleArea);
          else renderNotFound(articleArea);
          revealPage();
        });
    });
  </script>

    var responses = {

      "hello": "Hello! Feel free to ask me any questions about our services. For accurate info, it is always best to call or WhatsApp us.",
      "timings": "We are open from 11 AM to 8 PM every day.",

    var chatState = { isOpen: false, hasNewMessage: false, unreadCount: 0 };

    function toggleChat() {
      if (chatState.isOpen) { closeChat(); } else { openChat(); }
    }

    function openChat() {
      var chatPopup = document.getElementById("chatbot-popup");
      var chatContent = document.getElementById("chat-content");
      var chatButton = document.querySelector(".chat-icon-button");
      chatPopup.classList.add("active");
      chatButton.classList.add("open");
      chatState.isOpen = true;
      chatState.hasNewMessage = false;
      chatState.unreadCount = 0;
      chatButton.classList.remove("new-message");
      if (chatContent.innerHTML.indexOf("Welcome to Browfairy!") === -1) {
        appendMessage("Bot", "Welcome to Browfairy! I can assist you with FAQs and service-related questions.");
        showQuickReplies(["What is microblading", "Is it safe", "Does it hurt"]);
      }
    }

    function closeChat() {
      var chatPopup = document.getElementById("chatbot-popup");
      var chatButton = document.querySelector(".chat-icon-button");
      chatPopup.classList.remove("active");
      chatButton.classList.remove("open");
      chatState.isOpen = false;
    }

    function clearChat() {
      document.getElementById("chat-content").innerHTML = "";
      appendMessage("Bot", "Chat cleared. How can I help you?");
      showQuickReplies(["What is microblading", "Timings", "Book appointment"]);
    }

    function appendMessage(sender, text) {
      var chatContent = document.getElementById("chat-content");
      var messageDiv = document.createElement("div");
      messageDiv.className = "chat-message " + (sender === "User" ? "user-message" : "bot-message");
      messageDiv.innerHTML = '<div class="message-bubble ' + (sender === "User" ? "user-bubble" : "bot-bubble") + '">' + text + '</div>';
      chatContent.appendChild(messageDiv);
      chatContent.scrollTop = chatContent.scrollHeight;
    }

    function showQuickReplies(options) {
      var chatContent = document.getElementById("chat-content");
      var repliesDiv = document.createElement("div");
      repliesDiv.className = "quick-replies";
      options.forEach(function(option) {
        var btn = document.createElement("button");
        btn.className = "quick-reply-btn";
        btn.textContent = option;
        btn.onclick = function() { handleUserInput(option); };
        repliesDiv.appendChild(btn);
      });
      chatContent.appendChild(repliesDiv);
      chatContent.scrollTop = chatContent.scrollHeight;
    }

    function handleUserInput(input) {
      appendMessage("User", input);
      var lowerInput = input.toLowerCase().trim();
      var reply = responses[lowerInput] || responses["default"];
      var typingDiv = document.createElement("div");
      typingDiv.className = "chat-message bot-message";
      typingDiv.innerHTML = '<div class="message-bubble bot-bubble typing">Typing...</div>';
      document.getElementById("chat-content").appendChild(typingDiv);
      document.getElementById("chat-content").scrollTop = document.getElementById("chat-content").scrollHeight;

      setTimeout(function() {
        typingDiv.remove();
        appendMessage("Bot", reply);
      }, 800);
    }

    document.getElementById("chat-input").addEventListener("keypress", function(e) {
      if (e.key === "Enter") {
        var input = e.target.value.trim();
        if (!input) return;
        e.target.value = "";
        handleUserInput(input);
      }
    });

    setTimeout(function() {
      if (!chatState.isOpen) {
        chatState.hasNewMessage = true;
        chatState.unreadCount = 1;
        document.querySelector(".chat-icon-button").classList.add("new-message");
      }
    }, 3000);
  </script>




<script id="lazy-bg-video">
(function () {
  function loadVideo(video) {
    if (!video || video.getAttribute("data-loaded") === "1") {
      if (video && video.paused) {
        var play = video.play();
        if (play && play.catch) play.catch(function () {});
      }
      return;
    }
    var source = video.querySelector("source[data-src]");
    if (source && !source.getAttribute("src")) {
      source.setAttribute("src", source.getAttribute("data-src"));
    }
    video.setAttribute("data-loaded", "1");
    if (typeof video.load === "function") video.load();
    var playPromise = video.play();
    if (playPromise && playPromise.catch) playPromise.catch(function () {});
  }

  function init() {
    var isMobile = window.matchMedia("(max-width: 1024px)").matches;
    var desktop = document.getElementById("bg-video-desktop");
    var mobile = document.getElementById("bg-video-mobile");
    var single = document.getElementById("bg-video");
    if (desktop || mobile) {
      loadVideo(isMobile ? mobile : desktop);
    } else if (single) {
      loadVideo(single);
    }

    var serviceVideo = document.getElementById("service-video");
    if (serviceVideo) loadVideo(serviceVideo);

    if (!("IntersectionObserver" in window)) return;
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        var video = entry.target.tagName === "VIDEO" ? entry.target : entry.target.querySelector("video");
        if (!video) return;
        if (entry.isIntersecting) loadVideo(video);
        else if (!video.paused) video.pause();
      });
    }, { threshold: 0.35 });

    function observe(root) {
      if (!root) return;
      root.querySelectorAll("video").forEach(function (v) { io.observe(v); });
    }
    document.querySelectorAll(".slide video").forEach(function (v) { io.observe(v); });
    var mobileWrap = document.getElementById("mobile-services-container");
    if (mobileWrap) {
      observe(mobileWrap);
      new MutationObserver(function () { observe(mobileWrap); }).observe(mobileWrap, { childList: true, subtree: true });
    }
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})();
</script>
